name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Build the spec knowledge base (network, cached afterwards)
        run: python -m zbuilder --provider brief spec

      - name: Fetch conformance stories (checksums pinned in stories/urls.txt)
        run: python -m zbuilder stories

      - name: Unit tests
        run: pytest -q

      - name: Eval gate (Section 1b acceptance cases)
        run: python -m eval.run_eval
