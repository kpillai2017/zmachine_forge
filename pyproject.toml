[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmachine-forge"
version = "0.3.0"
description = "A study-friendly Z-machine v5 toolchain in Python: interpreter, ZIL-lite compiler, assembler - plus the agentic workflow (zbuilder) that builds it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []            # the product and the workflow use only the standard library

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
windows = ["windows-curses>=2.3; sys_platform == 'win32'"]

[project.scripts]
zforge = "zforge.cli:main"
zbuilder = "zbuilder.__main__:main"

[tool.setuptools.packages.find]
include = ["zforge*", "zbuilder*"]

[tool.setuptools.package-data]
zforge = ["lib/*.zil", "lib/i7/*.zil"]   # the ZIL-lite libraries INSERT-FILE finds

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spec", "stories", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023"]

[tool.ruff.lint.per-file-ignores]
# the generated opcode TABLE keeps one opcode per line - easier to read than wrapped rows
"zforge/common/opcodes.py" = ["E501"]
